# Render Deployment Configuration
# This file tells Render how to build and run your service.
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: student-management-api
    runtime: python
    region: singapore           # Closest to India — change if needed
    plan: free                  # Free tier for portfolio projects
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: mysql+pymysql://root:1234@localhost:3306/Students.db   # Replace with PostgreSQL URL for production
      - key: SECRET_KEY
        generateValue: true              # Render auto-generates a secure random value
      - key: PYTHON_VERSION
        value: 3.11.0
