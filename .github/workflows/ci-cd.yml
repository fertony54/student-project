# ─────────────────────────────────────────────────────────────
#  CI/CD Pipeline — Student Management API
#  Triggers: Push / PR to main or develop
# ─────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "mysql+pymysql://root:1234@localhost:3306/Students.db"

# Least privilege: the workflow token can only read the repo.
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────
# JOB 1 — Code Quality (lint + format checks)
# ─────────────────────────────────────────────────────────────
jobs:
  code-quality:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code formatting (black)
        run: black --check --diff app/ tests/

      - name: Check import order (isort)
        run: isort --check-only --diff app/ tests/

      - name: Lint with flake8
        run: flake8 app/ tests/

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Tests (unit + integration + coverage)
  # ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests & Coverage"
    runs-on: ubuntu-latest
    needs: code-quality          # Only run tests if linting passes

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # Test across Python versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENVIRONMENT: testing
        run: |
          pytest tests/ \
            --verbose \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'   # Upload only once
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Security Scan
  # ─────────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install pip-audit bandit

      # Static analysis of OUR code. --exit-zero keeps it advisory
      # (reports issues in the log without failing the build).
      - name: Static security analysis (bandit)
        run: bandit -r app/ -ll --exit-zero

      # Scans installed dependencies for known CVEs.
      # continue-on-error keeps a flaky advisory feed from blocking a class,
      # while still surfacing findings in the job log.
      - name: Audit dependencies for known CVEs (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  # ─────────────────────────────────────────────────────────────
  # JOB 4 — Build & Smoke Test
  # ─────────────────────────────────────────────────────────────
  build:
    name: "🏗️ Build & Smoke Test"
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app imports & starts correctly
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python -c "from app.main import app; print('✅ App imported successfully')"
          python -c "from app.core.config import settings; print(f'✅ Config loaded: {settings.VERSION}')"
          python -c "from app.db.database import create_tables; create_tables(); print('✅ DB tables created')"

      - name: Start server and smoke test /health
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 3

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            kill $SERVER_PID
            exit 1
          fi

          kill $SERVER_PID

  # ─────────────────────────────────────────────────────────────
  # JOB 5 — Deploy to Render (only on push to main)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Render"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # can require a human to click "Approve" (Settings → Environments)

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering deployment to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo ""
          echo "✅ Deployment triggered successfully!"

      - name: Post-deploy health check
        run: |
          echo "⏳ Waiting for deployment to go live..."
          sleep 60
          DEPLOY_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -n "$DEPLOY_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/health" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Production health check passed!"
            else
              echo "⚠️ Health check returned HTTP $STATUS (deployment may still be warming up)"
            fi
          else
            echo "ℹ️ RENDER_APP_URL secret not set — skipping post-deploy check"
          fi
